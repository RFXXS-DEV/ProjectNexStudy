<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Slabo+27px&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <title>Criar conta | NexStudy</title>

</head>

<body class="min-h-screen bg-green-50 font-inter text-gray-800">

    <!-- Página inteira -->
    <main class="flex min-h-screen overflow-hidden">

        <!-- ========================================= -->
        <!-- LADO ESQUERDO - IMAGEM -->
        <!-- ========================================= -->
        <section class="hidden h-screen w-1/2 lg:block">

            <img src="{{ url_for('static', filename='img/FundoCadastro.jpg') }}" alt="Imagem de fundo"
                class="h-full w-full object-cover">

        </section>


        <!-- ========================================= -->
        <!-- LADO DIREITO -->
        <!-- ========================================= -->
        <section class="flex min-h-screen w-full items-center justify-center bg-linear-to-br from-green-50 via-green-100 to-emerald-200 px-6 py-8 lg:w-1/2">

            <!-- Container principal -->
            <div class="flex w-full max-w-md flex-col items-center rounded-3xl border border-white/80 bg-white/75 p-7 shadow-xl shadow-green-900/10 backdrop-blur-sm sm:p-9">

                <!-- Logo -->
                <img src="{{ url_for('static', filename='img/LogoNexStudy.png') }}" alt="Logo NexStudy"
                    class="mb-1 w-32 drop-shadow-sm">

                <!-- Título -->
                <h1 class="mb-1 text-center font-dancing text-5xl text-green-700">
                    Bem-vindo ao NexStudy
                </h1>

                <p class="mb-5 text-center text-sm text-gray-500">Crie sua conta e organize seus estudos.</p>

                <!-- ================================= -->
                <!-- FORMULÁRIO -->
                <!-- ================================= -->

                <form action="" method="POST" class="flex w-full flex-col gap-3">

                    <!-- Nome -->
                    <div class="relative">
                        <img src="{{ url_for('static', filename='icons/IconeNome(Light).png') }}" alt="Ícone Nome"
                            class="absolute left-5 top-1/2 h-5 w-5 -translate-y-1/2">

                        <input type="text" id="nome" name="nome" placeholder="Nome" required
                            class="h-13 w-full rounded-2xl border border-gray-200 bg-white pl-14 pr-4 text-base font-medium shadow-sm outline-none transition placeholder:text-gray-400 focus:border-green-500 focus:ring-4 focus:ring-green-500/15">
                    </div>

                    <!-- Email -->
                    <div class="relative">
                        <img src="{{ url_for('static', filename='icons/IconeEmail(Light).png') }}" alt="Ícone Email"
                            class="absolute left-5 top-1/2 h-5 w-5 -translate-y-1/2">

                        <input type="email" id="email" name="email" placeholder="E-mail" required
                            class="h-13 w-full rounded-2xl border border-gray-200 bg-white pl-14 pr-4 text-base font-medium shadow-sm outline-none transition placeholder:text-gray-400 focus:border-green-500 focus:ring-4 focus:ring-green-500/15">
                    </div>

                    <!-- Senha -->
                    <div class="relative">
                        <img src="{{ url_for('static', filename='icons/IconeSenha(Light).png') }}" alt="Ícone Senha"
                            class="absolute left-5 top-1/2 h-5 w-5 -translate-y-1/2">

                        <input type="password" id="senha" name="senha" placeholder="Senha" required
                            class="h-13 w-full rounded-2xl border border-gray-200 bg-white pl-14 pr-14 text-base font-medium shadow-sm outline-none transition placeholder:text-gray-400 focus:border-green-500 focus:ring-4 focus:ring-green-500/15">

                        <img id="olhoSenha" src="{{ url_for('static', filename='icons/IconeOlhoFechado(Light).png') }}"
                            alt="Mostrar senha"
                            class="absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2 cursor-pointer opacity-70 transition hover:opacity-100">
                    </div>

                    <!-- Confirmar senha -->
                    <div class="relative">
                        <img src="{{ url_for('static', filename='icons/IconeSenha(Light).png') }}" alt="Ícone Senha"
                            class="absolute left-5 top-1/2 h-5 w-5 -translate-y-1/2">

                        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirmar senha"
                            required
                            class="h-13 w-full rounded-2xl border border-gray-200 bg-white pl-14 pr-14 text-base font-medium shadow-sm outline-none transition placeholder:text-gray-400 focus:border-green-500 focus:ring-4 focus:ring-green-500/15">

                        <img id="olhoConfirmarSenha"
                            src="{{ url_for('static', filename='icons/IconeOlhoFechado(Light).png') }}"
                            alt="Mostrar senha"
                            class="absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2 cursor-pointer opacity-70 transition hover:opacity-100">
                    </div>

                    <!-- Botão -->
                    <button type="submit"
                        class="mt-2 h-14 w-full cursor-pointer rounded-2xl bg-green-700 text-base font-semibold text-white shadow-lg shadow-green-700/20 transition hover:-translate-y-0.5 hover:bg-green-800 hover:shadow-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-700">

                        Criar conta

                    </button>

                </form>

                <!-- Link -->
                <p class="mt-5 text-sm text-gray-600">

                    Já possui conta?

                    <a href="{{ url_for('login') }}" class="text-green-900 font-semibold hover:underline">

                        Entrar

                    </a>

                </p>

            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/cadastro.js') }}" defer></script>

</body>
</html>
