<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Slabo+27px&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <title>Pomodoro</title>
</head>

<body class="min-h-screen bg-linear-to-br from-[#d1fad8] to-[#bbf7d0] font-sans text-gray-800 transition-colors duration-300 selection:bg-green-300 dark:from-[#080809] dark:to-[#111214] dark:text-[#f2f3f5]">

    <main class="flex h-screen overflow-hidden">

        {% include "components/sidebar.html" %}

        <section class="min-w-0 flex-1 overflow-y-auto p-4 text-slate-800 dark:text-[#f2f3f5]">
            {% include "components/topbar.html" %}

        <div class="flex-1 p-6 md:p-10 overflow-y-auto flex items-center justify-center">

            <div class="w-full max-w-7xl grid grid-cols-1 xl:grid-cols-12 gap-10 items-center">

                <div class="xl:col-span-8 flex flex-col items-center justify-center w-full gap-8">

                    <div class="flex flex-col items-center gap-6 w-full">

                        <div class="bg-white/60 dark:bg-[#111214]/80 p-1.5 rounded-full inline-flex shadow-sm backdrop-blur-md">

                            <a href="{{ url_for('timer') }}"
                                class="text-gray-500 dark:text-[#b5bac1] font-semibold text-sm rounded-full px-8 py-2.5 hover:bg-white/50 transition-all">

                                Relógio

                            </a>

                            <a href="{{ url_for('pomodoro') }}" aria-current="page"
                                class="bg-[#f87171] text-white font-bold text-sm rounded-full px-8 py-2.5 shadow-md transition-all">

                                Pomodoro

                            </a>

                        </div>

                        <div class="flex flex-wrap justify-center gap-4 w-full max-w-2xl">

                            <div class="relative flex-1 min-w-50">

                                <select
                                    class="w-full appearance-none bg-white/80 dark:bg-[#111214]/90 backdrop-blur-md rounded-3xl px-6 py-4 text-gray-700 dark:text-[#dbdee1] font-semibold shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-white dark:border-[#242529] focus:outline-none focus:ring-2 focus:ring-[#f87171] cursor-pointer transition-all">

                                    <option>Matemática</option>

                                    <option>História</option>

                                </select>

                                <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">

                                    <svg class="w-5 h-5 text-gray-500 dark:text-[#b5bac1]" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19 9l-7 7-7-7"></path>
                                    </svg>

                                </div>

                            </div>

                            <div
                                class="flex bg-white/60 dark:bg-[#111214]/80 backdrop-blur-md p-1.5 rounded-3xl shadow-sm border border-white dark:border-[#242529] min-w-55">

                                <button
                                    class="flex-1 flex items-center justify-center gap-2 text-gray-500 dark:text-[#b5bac1] font-bold rounded-2xl px-4 py-2.5 hover:bg-white/50 transition-all">

                                    <span class="h-5 w-5 rounded-md border-2 border-dashed border-gray-300 dark:border-[#6d6f78]" aria-hidden="true"></span>

                                    25 / 5

                                </button>

                                <button
                                    class="flex-1 flex items-center justify-center gap-2 bg-[#fecaca] dark:bg-[#4a2c30] text-[#991b1b] font-bold rounded-2xl px-4 py-2.5 shadow-sm transition-all border border-red-200/50">

                                    <span class="h-5 w-5 rounded-md border-2 border-dashed border-red-300 dark:border-red-400/60" aria-hidden="true"></span>

                                    50 / 10

                                </button>

                            </div>

                        </div>

                    </div>

                    <div
                        class="bg-white/80 dark:bg-[#111214]/90 backdrop-blur-2xl rounded-[3rem] w-full max-w-2xl p-8 md:p-12 shadow-[0_20px_50px_rgb(0,0,0,0.05)] border border-white dark:border-[#242529] flex flex-col items-center justify-center relative overflow-hidden transition-all hover:shadow-[0_20px_50px_rgb(0,0,0,0.08)]">

                        <div
                            class="absolute -top-24 -right-24 w-64 h-64 bg-linear-to-br from-red-100 to-red-50 rounded-full blur-3xl opacity-70">
                        </div>

                        <!-- Substitua este bloco por uma tag <img> quando escolher o ícone do Pomodoro. -->
                        <div id="espaco-icone-pomodoro" role="img" aria-label="Espaço reservado para o ícone do Pomodoro"
                            class="z-10 mb-3 flex h-24 w-24 items-center justify-center rounded-3xl border-2 border-dashed border-red-300 bg-red-50/70 text-center text-xs font-semibold text-red-400 transition hover:border-red-400 dark:border-red-400/40 dark:bg-red-950/20 md:h-28 md:w-28">
                            Seu ícone
                        </div>

                        <div
                            class="text-[5.5rem] sm:text-[7.5rem] md:text-[9.5rem] font-extrabold text-transparent bg-clip-text bg-linear-to-b from-[#ef4444] to-[#b91c1c] leading-none tracking-tighter tabular-nums drop-shadow-sm z-10">
                            50:00
                        </div>

                        <div class="flex flex-wrap justify-center gap-4 mt-8 z-10">

                            <button
                                class="bg-white/80 dark:bg-[#111214]/90 backdrop-blur-sm hover:bg-white text-[#991b1b] font-bold py-3.5 px-8 rounded-full transition-all flex items-center gap-2 shadow-[0_4px_15px_rgb(0,0,0,0.02)] border border-red-50 hover:-translate-y-0.5">

                                <svg class="w-5 h-5 text-[#ef4444]" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>

                                Reiniciar

                            </button>

                            <button
                                class="bg-linear-to-r from-[#34d399] to-[#10b981] hover:from-[#10b981] hover:to-[#059669] text-white font-bold py-3.5 px-10 rounded-full transition-all flex items-center gap-2 shadow-lg shadow-green-400/40 transform hover:-translate-y-1">

                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                                        clip-rule="evenodd"></path>
                                </svg>

                                Iniciar

                            </button>

                            <button
                                class="bg-white/80 dark:bg-[#111214]/90 backdrop-blur-sm hover:bg-white text-[#991b1b] font-bold py-3.5 px-8 rounded-full transition-all flex items-center gap-2 shadow-[0_4px_15px_rgb(0,0,0,0.02)] border border-red-50 hover:-translate-y-0.5">

                                <svg class="w-5 h-5 text-[#ef4444]" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                        d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>

                                Pausar

                            </button>

                        </div>

                    </div>

                </div>

                <div class="xl:col-span-4 w-full h-137.5 flex flex-col">

                    <div
                        class="bg-white/60 dark:bg-[#111214]/80 backdrop-blur-xl rounded-[2.5rem] p-8 shadow-sm border border-white dark:border-[#242529] h-full flex flex-col">

                        <div class="bg-[#bbf7d0] dark:bg-[#263c32] rounded-2xl py-3.5 px-6 mb-6 shadow-inner text-center">

                            <h2 class="text-[#064e3b] dark:text-emerald-300 font-bold text-lg tracking-wide uppercase">Histórico Rápido</h2>

                        </div>

                        <div class="flex flex-col gap-4 overflow-y-auto pr-2 custom-scrollbar">

                            <div
                                class="bg-[#a7f3d0] dark:bg-[#29443a] p-5 rounded-3xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden shrink-0">

                                <div class="absolute top-0 left-0 w-2 h-full bg-[#059669]"></div>

                                <h3 class="font-bold text-[#064e3b] dark:text-emerald-300 text-xl ml-2">Matemática</h3>

                                <p class="text-[#047857] text-sm ml-2 mt-1 font-medium">45 min <span
                                        class="mx-2 opacity-50">•</span> Hoje</p>

                            </div>

                            <div
                                class="bg-[#d1fae5] dark:bg-[#263c32] p-5 rounded-3xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden shrink-0">

                                <div class="absolute top-0 left-0 w-2 h-full bg-[#34d399]"></div>

                                <h3 class="font-bold text-[#064e3b] dark:text-emerald-300 text-xl ml-2">Ciências</h3>

                                <div class="flex items-center gap-2 ml-2 mt-1">

                                    <p
                                        class="text-[#047857] text-sm font-medium underline decoration-[#34d399] decoration-2 underline-offset-4">
                                        30 min</p>

                                    <span class="text-[#047857] opacity-50">•</span>

                                    <p class="text-[#047857] text-sm font-medium">Ontem</p>

                                </div>
                            </div>

                            <div
                                class="bg-white/80 dark:bg-[#111214]/90 border border-[#a7f3d0] p-5 rounded-3xl shadow-sm hover:bg-white transition-colors relative overflow-hidden shrink-0">

                                <div class="absolute top-0 left-0 w-2 h-full bg-gray-300"></div>

                                <h3 class="font-bold text-gray-700 dark:text-[#dbdee1] text-xl ml-2">Programação Web</h3>

                                <p class="text-gray-500 dark:text-[#b5bac1] text-sm ml-2 mt-1 font-medium">1h 20m <span
                                        class="mx-2 opacity-50">•</span> 2 dias atrás</p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
        </section>
    </main>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a7f3d0;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #34d399;
        }
    </style>
    <script src="{{ url_for('static', filename='js/pomodoro.js') }}" defer></script>
</body>

</html>
