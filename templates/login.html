<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Slabo+27px&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <title>Entrar | NexStudy</title>
</head>

<body class="min-h-screen bg-green-50 font-inter text-gray-800">

        <!-- Página inteira -->
        <main class="flex min-h-screen overflow-hidden">

            <!-- ========================================= -->
            <!-- LADO ESQUERDO - IMAGEM -->
            <!-- ========================================= -->
            <section class="hidden h-screen w-1/2 lg:block">

                <img src="{{ url_for('static', filename='img/FundoLogin.jpg') }}" alt="Imagem de fundo"
                    class="h-full w-full object-cover">

            </section>

            <!-- ========================================= -->
            <!-- LADO DIREITO -->
            <!-- ========================================= -->
            <section class="flex min-h-screen w-full items-center justify-center bg-linear-to-br from-green-50 via-green-100 to-emerald-200 px-6 py-10 lg:w-1/2">

                <!-- Container principal -->
                <div class="flex w-full max-w-md flex-col items-center rounded-3xl border border-white/80 bg-white/75 p-8 shadow-xl shadow-green-900/10 backdrop-blur-sm sm:p-10">

                    <!-- Logo -->
                    <img src="{{ url_for('static', filename='img/LogoNexStudy.png') }}" alt="Logo NexStudy"
                        class="mb-1 w-36 drop-shadow-sm">

                    <!-- Título -->
                    <h1 class="mb-2 text-center font-dancing text-5xl text-green-700">
                        Bem-vindo de volta
                    </h1>

                    <p class="mb-7 text-center text-sm text-gray-500">Entre para continuar seus estudos.</p>

                    <!-- ================================= -->
                    <!-- FORMULÁRIO -->
                    <!-- ================================= -->

                    <form action="" method="POST" class="flex w-full flex-col gap-4">

                        <!-- Email -->
                        <div class="relative">
                            <img src="{{ url_for('static', filename='icons/IconeEmail(Light).png') }}" alt="Ícone Email"
                                class="absolute left-5 top-1/2 h-5 w-5 -translate-y-1/2">

                            <input type="email" id="email" name="email" placeholder="E-mail" required
                                class="h-14 w-full rounded-2xl border border-gray-200 bg-white pl-14 pr-4 text-base font-medium shadow-sm outline-none transition placeholder:text-gray-400 focus:border-green-500 focus:ring-4 focus:ring-green-500/15">
                        </div>

                        <!-- Senha -->
                        <div class="relative">
                            <img src="{{ url_for('static', filename='icons/IconeSenha(Light).png') }}" alt="Ícone Senha"
                                class="absolute left-5 top-1/2 h-5 w-5 -translate-y-1/2">

                            <input type="password" id="senha" name="senha" placeholder="Senha" required
                                class="h-14 w-full rounded-2xl border border-gray-200 bg-white pl-14 pr-14 text-base font-medium shadow-sm outline-none transition placeholder:text-gray-400 focus:border-green-500 focus:ring-4 focus:ring-green-500/15">

                            <img id="olhoSenha"
                                src="{{ url_for('static', filename='icons/IconeOlhoFechado(Light).png') }}"
                                alt="Mostrar senha"
                                class="absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2 cursor-pointer opacity-70 transition hover:opacity-100">
                        </div>

                        <!-- Esqueci minha senha -->
                        <div class="flex justify-end">
                            <a href="#" class="text-sm text-green-800 font-semibold hover:underline">

                                Esqueci minha senha

                            </a>
                        </div>

                        <!-- Botão -->
                        <button type="submit"
                            class="mt-2 h-14 w-full cursor-pointer rounded-2xl bg-green-700 text-base font-semibold text-white shadow-lg shadow-green-700/20 transition hover:-translate-y-0.5 hover:bg-green-800 hover:shadow-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-700">

                            Entrar

                        </button>

                    </form>

                    <!-- Link -->
                    <p class="mt-6 text-sm text-gray-600">

                        Ainda não possui conta?

                        <a href="{{ url_for('cadastro') }}" class="text-green-900 font-semibold hover:underline">

                            Criar conta

                        </a>

                    </p>

                </div>

            </section>

        </main>

    <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>

</html>
